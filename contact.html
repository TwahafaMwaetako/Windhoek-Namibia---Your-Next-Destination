<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Windhoek, Namibia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
      <div class="container">
        <h1 class="logo">Windhoek, Namibia</h1>
        <nav>
            <ul>
                 <li><a href="index.html">Home</a></li>
                 <li><a href="about.html">About Windhoek</a></li>
                 <li><a href="attractions.html">Top Attractions</a></li>
                 <li><a href="plan.html">Plan Your Visit</a></li>
                 <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
      </div>
    </header>

    <main class="container">
         <!-- Introduction to the Contact Us Page -->
        <section class="contact-intro">
            <h2>Contact Us</h2>
            <p>We are here to help. Reach out with your queries.</p>
        </section>

        <section class="contact-form">
             <!-- Contact Form -->
           <form action="#" method="post" class="contact-form">
                  <label for="name">Name:</label>
                  <input type="text" id="name" name="name" required>

                 <label for="email">Email:</label>
                  <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                 <textarea id="message" name="message" rows="4" required></textarea>
             <div class="form-buttons">
                 <button type="submit" class="button">Send</button>
                 <button type="reset" class="button-discard">Discard</button>
              </div>
          </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Windhoek Tourism Mini Site. All Rights Reserved.</p>
        </div>
    </footer>
</body>
</html>
